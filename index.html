<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"><title>Aither Maps</title></head>
<body><div class="app-shell">
<header class="topbar"><button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button><div class="brand"><span class="brand-mark">A</span><div><strong>Aither Maps</strong><small id="locationLabel">Explore the world</small></div></div><button id="locateBtn" class="icon-btn" aria-label="My location">⌖</button></header>
<section class="search-wrap"><form id="searchForm" class="searchbar"><span>⌕</span><input id="searchInput" autocomplete="off" placeholder="Search places or addresses" aria-label="Search places or addresses"><button type="button" id="clearSearch" aria-label="Clear search">×</button></form><div id="searchResults" class="search-results" hidden></div></section>
<div id="map"></div><div class="map-actions"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="layersBtn" aria-label="Map layers">▦</button></div>
<aside id="sidePanel" class="side-panel" aria-hidden="true"><div class="panel-head"><h2>Aither Maps</h2><button id="closePanel" class="icon-btn">×</button></div><button class="menu-item" data-action="locate">⌖ <span>My Location</span></button><button class="menu-item" data-action="layers">▦ <span>Map Layers</span></button><button class="menu-item" data-action="favorites">★ <span>Saved Places</span></button><button class="menu-item" data-action="settings">⚙ <span>Settings</span></button><div class="panel-info">Version <strong id="versionText">2.0.0</strong></div></aside>
<div id="layerCard" class="floating-card" hidden><h3>Map style</h3><button class="choice active" data-layer="standard">Standard</button><button class="choice" data-layer="dark">Dark</button><button class="choice" data-layer="satellite">Satellite</button></div>
<section id="settings" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>Settings</h2><button id="closeSettings" class="icon-btn">×</button></div><label class="setting"><span>Theme</span><select id="themeSetting"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label class="setting"><span>Map style</span><select id="mapSetting"><option value="standard">Standard</option><option value="dark">Dark</option><option value="satellite">Satellite</option></select></label><label class="setting"><span>Show scale</span><input id="scaleSetting" type="checkbox" checked></label><button id="forceUpdate" class="danger-btn">Force Update</button><p class="hint">Clears cached Aither Maps data and reloads the latest files.</p></div></section>
<div id="toast" role="status" aria-live="polite"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
