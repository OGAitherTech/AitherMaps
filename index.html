<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Aither Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">AW</div>
        <div><strong>Aither Weather</strong><span id="locationLabel">Your weather</span></div>
      </div>
      <button class="icon-button" id="settingsButton" aria-label="Open settings">⚙</button>
    </header>

    <main>
      <section class="search-row">
        <form id="searchForm" class="search-box">
          <input id="locationInput" autocomplete="off" placeholder="Search city or ZIP code" aria-label="Search location">
          <button type="submit">Search</button>
        </form>
        <button class="location-button" id="useLocation" title="Use my location">⌖</button>
      </section>

      <section class="current-card" aria-live="polite">
        <div>
          <p class="eyebrow" id="currentPlace">Current conditions</p>
          <div class="temperature"><span id="temperature">--</span><sup id="unit">°F</sup></div>
          <h1 id="condition">Loading weather…</h1>
          <p class="feels">Feels like <span id="feelsLike">--</span> · Updated <span id="updated">--</span></p>
        </div>
        <div class="weather-icon" id="weatherIcon">☁</div>
      </section>

      <section class="metrics-grid">
        <article><span>Humidity</span><strong id="humidity">--</strong></article>
        <article><span>Wind</span><strong id="wind">--</strong></article>
        <article><span>Pressure</span><strong id="pressure">--</strong></article>
        <article><span>UV Index</span><strong id="uv">--</strong></article>
      </section>

      <section class="panel">
        <div class="section-heading"><h2>Hourly</h2><button id="refreshButton">Refresh</button></div>
        <div class="hourly" id="hourly"></div>
      </section>

      <section class="panel">
        <div class="section-heading"><h2>7-Day Forecast</h2></div>
        <div class="forecast" id="forecast"></div>
      </section>
    </main>

    <footer>Weather data by Open-Meteo · Aither Weather <span id="versionText">v1.0.0</span></footer>
  </div>

  <dialog id="settingsDialog">
    <div class="dialog-header"><h2>Settings</h2><button id="closeSettings" class="icon-button">×</button></div>
    <label class="setting"><span>Temperature unit</span><select id="unitSelect"><option value="fahrenheit">Fahrenheit (°F)</option><option value="celsius">Celsius (°C)</option></select></label>
    <label class="setting"><span>Theme</span><select id="themeSelect"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <div class="setting update-setting"><div><strong>App update</strong><small>Reload the latest Aither Weather files.</small></div><button id="forceUpdate">Force update</button></div>
    <p class="settings-status" id="settingsStatus"></p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
